/* first screen: the corridor film from the homepage, full bleed, type placed on the dark ceiling */
body{position:relative;overflow-x:hidden;place-items:start center;padding-top:clamp(64px,13vh,128px)}
.nf-film{position:fixed;inset:0;z-index:-1;background:#0a0a0a}
.nf-film video{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block;animation:nfPush 24s linear infinite alternate;transform-origin:50% 46%;will-change:transform}
@keyframes nfPush{from{transform:scale(1.02)}to{transform:scale(1.1)}}
html.nf-paused .nf-film video{animation-play-state:paused}

.nf-pp:focus-visible{outline:2px solid #b9a8ff;outline-offset:3px}
.nf-pp-i{width:8px;height:10px;border-left:3px solid currentColor;border-right:3px solid currentColor}
@media(max-width:620px){body{place-items:end center;padding:96px 20px 40px}}
html.nf-paused .nf-pp-i{width:0;height:0;border-left:9px solid currentColor;border-right:0;border-top:5px solid transparent;border-bottom:5px solid transparent}
