<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Book a Free Website Concept Call | Jarrett Wroten</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23040A0C%27/%3E%3Ctext x=%2716%27 y=%2722%27 text-anchor=%27middle%27 font-size=%2718%27 fill=%27%235EE7F0%27%3EJ%3C/text%3E%3C/svg%3E">
  <meta name="description" content="Book a 15-minute Google Meet. Add your current website, tell Jarrett what it needs to do better, and get a free concept.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://jarrettwroten.com/book/">
  <meta property="og:title" content="Book a Free Website Concept Call | Jarrett Wroten">
  <meta property="og:description" content="Add your current website and get a free concept for the call.">
  <meta property="og:url" content="https://jarrettwroten.com/book/">
  <meta property="og:image" content="https://jarrettwroten.com/assets/golden-arrival/frames/ga-360.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Book a Free Website Concept Call | Jarrett Wroten">
  <meta name="twitter:description" content="Add your current website and get a free concept for the call.">
  <meta name="twitter:image" content="https://jarrettwroten.com/assets/golden-arrival/frames/ga-360.webp">
  <style>
    @font-face{
      font-family:"Bodoni Moda";
      src:url("../assets/fonts/bodoni-moda-latin-variable.woff2") format("woff2");
      font-style:normal;
      font-weight:400 900;
      font-display:swap;
    }
    @font-face{
      font-family:"IBM Plex Sans";
      src:url("../assets/fonts/ibm-plex-sans-latin-variable.woff2") format("woff2");
      font-style:normal;
      font-weight:100 700;
      font-display:swap;
    }
    @font-face{
      font-family:"Rana Reader Fallback";
      src:url("../assets/fonts/rana-reader-fallback-roman.woff2") format("woff2");
      font-style:normal;
      font-weight:400;
      font-display:swap;
    }
    :root{
      --void:#040a0c;
      --ink:#e8f4f4;
      --ink-soft:rgba(232,244,244,.9);
      --ink-mute:rgba(208,228,230,.78);
      --cyan:#5ee7f0;
      --amber:#d97a3a;
      --display:"Bodoni Moda","Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
      --reading:Georgia,"Rana Reader Fallback","Times New Roman",Times,serif;
      --text:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      --gutter:clamp(1.25rem,3vw,2.7rem);
    }
    *{box-sizing:border-box}
    html{background:var(--void);color:var(--ink)}
    body{margin:0;min-width:320px;background:var(--void);font-family:var(--text)}
    a{color:inherit;text-decoration:none}
    .skip-link{
      position:fixed;
      z-index:20;
      top:.6rem;
      left:.6rem;
      padding:.7rem 1rem;
      background:#fff;
      color:#111;
      transform:translateY(-160%);
    }
    .skip-link:focus{transform:none}
    .booking-page{
      display:grid;
      grid-template-columns:minmax(24rem,38vw) minmax(0,1fr);
      min-height:100svh;
      background:#fff;
    }
    .booking-intro{
      position:sticky;
      top:0;
      align-self:start;
      height:100svh;
      min-height:42rem;
      overflow:hidden;
      isolation:isolate;
      background:var(--void);
    }
    .booking-portrait,
    .booking-wash{
      position:absolute;
      inset:0;
    }
    .booking-portrait{
      z-index:-2;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:24% 50%;
    }
    .booking-wash{
      z-index:-1;
      background:
        linear-gradient(180deg,rgba(4,10,12,.58) 0%,rgba(4,10,12,.08) 34%,rgba(4,10,12,.38) 57%,rgba(4,10,12,.95) 100%),
        linear-gradient(90deg,rgba(4,10,12,.56) 0%,rgba(4,10,12,.08) 70%,rgba(4,10,12,.34) 100%);
    }
    .booking-header{
      position:absolute;
      z-index:2;
      top:0;
      left:0;
      right:0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:1rem;
      min-height:4.5rem;
      padding:calc(.9rem + env(safe-area-inset-top)) var(--gutter) .8rem;
    }
    .wordmark,
    .back-link{
      display:inline-flex;
      align-items:center;
      min-height:44px;
      font-family:var(--text);
      font-size:1rem;
      font-weight:600;
      letter-spacing:.01em;
    }
    .back-link{border-bottom:1px solid rgba(94,231,240,.65)}
    .booking-copy{
      position:absolute;
      left:var(--gutter);
      right:var(--gutter);
      bottom:calc(2.25rem + env(safe-area-inset-bottom));
      z-index:2;
      max-width:31rem;
    }
    h1{
      margin:0 0 1rem;
      max-width:7ch;
      font-family:var(--display);
      font-size:clamp(3.2rem,5.6vw,5.7rem);
      font-weight:400;
      font-optical-sizing:auto;
      line-height:.94;
      letter-spacing:0;
    }
    .booking-lead{
      margin:0 0 1rem;
      max-width:34ch;
      font-family:var(--reading);
      font-size:clamp(1.06rem,1.2vw,1.22rem);
      font-weight:400;
      line-height:1.5;
      color:var(--ink-soft);
    }
    .booking-facts{
      margin:0 0 1rem;
      font-family:var(--text);
      font-size:1rem;
      font-weight:600;
      line-height:1.5;
      color:var(--ink);
    }
    .booking-note{
      margin:0;
      max-width:40ch;
      font-family:var(--reading);
      font-size:.9rem;
      line-height:1.45;
      color:var(--ink-mute);
    }
    .booking-note a{border-bottom:1px solid rgba(94,231,240,.55)}
    .booking-panel{
      position:relative;
      min-width:0;
      min-height:100svh;
      background:#fff;
    }
    .booking-panel h2{
      position:absolute;
      width:1px;
      height:1px;
      overflow:hidden;
      clip:rect(0 0 0 0);
      white-space:nowrap;
    }
    .booking-frame{
      display:block;
      width:100%;
      height:100svh;
      min-height:52rem;
      border:0;
      background:#fff;
    }
    .wordmark:focus-visible,
    .back-link:focus-visible,
    .booking-note a:focus-visible{
      outline:2px solid var(--cyan);
      outline-offset:4px;
    }
    @media (max-width:900px){
      .booking-page{display:block}
      .booking-intro{
        position:relative;
        height:min(42rem,76svh);
        min-height:34rem;
      }
      .booking-portrait{object-position:24% 46%}
      .booking-copy{bottom:calc(1.8rem + env(safe-area-inset-bottom))}
      h1{font-size:clamp(3rem,9vw,4.25rem);max-width:7ch}
      .booking-panel{min-height:62rem}
      .booking-frame{height:62rem;min-height:62rem}
    }
    @media (max-width:520px){
      .booking-intro{height:38rem;min-height:38rem}
      .booking-header{padding-left:1.1rem;padding-right:1.1rem}
      .booking-copy{left:1.1rem;right:1.1rem;bottom:1.6rem}
      h1{font-size:clamp(2.75rem,13vw,3.6rem);margin-bottom:.8rem}
      .booking-lead{font-size:1.05rem;line-height:1.44;margin-bottom:.8rem}
      .booking-facts{margin-bottom:.75rem}
      .booking-note{font-size:.875rem}
      .booking-panel{min-height:67rem}
      .booking-frame{height:67rem;min-height:67rem}
    }
  </style>
  <link rel="stylesheet" href="/assets/accessibility.css?v=20260904-a">
  <script src="/assets/accessibility.js?v=20260904-a" defer></script>
</head>
<body>
  <a class="skip-link" href="#calendar">Skip to available times</a>
  <main class="booking-page">
    <section class="booking-intro" aria-labelledby="booking-title">
      <img class="booking-portrait" src="../assets/golden-arrival/frames/ga-360.webp" alt="" width="1280" height="720">
      <div class="booking-wash" aria-hidden="true"></div>
      <header class="booking-header">
        <a class="wordmark" href="../" aria-label="Jarrett Wroten home">Jarrett Wroten</a>
        <a class="back-link" href="../work/">Work</a>
      </header>
      <div class="booking-copy">
        <h1 id="booking-title">Pick a time. I’ll bring your free concept.</h1>
        <p class="booking-lead">Add your current website and tell me what you want it to do better. I’ll build your concept before our call.</p>
        <p class="booking-facts">15 minutes · Google Meet · Pacific time</p>
        <p class="booking-note"><a href="https://calendar.app.google/rTkdNoWpm6iRrXhB7" target="_blank" rel="noopener noreferrer">Open in Google Calendar</a> · <a href="../privacy/">Privacy</a></p>
      </div>
    </section>
    <section class="booking-panel" id="calendar" aria-labelledby="calendar-title">
      <h2 id="calendar-title">Book your appointment</h2>
      <iframe
        class="booking-frame"
        title="Book your free website concept call"
        src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2YdXyVF5uIUo74Fv4SrprKAVyqtont8zyMcfribjk4uwAJCGMvckaErguyS5pJ23xRft13Ebzb?gv=true"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </section>
  </main>
</body>
</html>
